    <circle cx="72" cy="85" r="25" fill="#2563eb"/><circle cx="133" cy="65" r="17" fill="#7c3aed"/><circle cx="158" cy="116" r="20" fill="#059669"/>
    <path d="M45 49 L182 42 L196 134 L58 145 Z" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/>
