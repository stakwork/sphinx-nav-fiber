<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">3D graph overview wireframe</title>
  <desc id="desc">A left filter rail, central clustered graph, breadcrumb, legend, and mini-map.</desc>
  <rect width="1440" height="900" fill="#111827"/>
  <rect x="0" y="0" width="300" height="900" fill="#f8fafc"/>
  <text x="28" y="48" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">Graph explorer</text>
  <rect x="24" y="76" width="252" height="48" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="44" y="107" font-family="sans-serif" font-size="16" fill="#64748b">Search name, path, tag…  /</text>
  <text x="28" y="164" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">NODE TYPES</text>
