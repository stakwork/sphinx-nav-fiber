    <line x1="650" y1="420" x2="870" y2="460"/><line x1="650" y1="420" x2="730" y2="650"/>
    <line x1="650" y1="420" x2="450" y2="590"/><line x1="820" y1="260" x2="920" y2="160"/>
  </g>
