  <text x="1108" y="678" font-family="sans-serif" font-size="14" fill="#334155">→ calls Wallet</text>
  <text x="1108" y="710" font-family="sans-serif" font-size="14" fill="#334155">← used by API</text>
  <rect x="300" y="822" width="512" height="48" rx="8" fill="#1e293b"/>
  <text x="322" y="852" font-family="sans-serif" font-size="14" fill="#cbd5e1">Escape: back to Core · Enter: focus · Space: expand/collapse</text>
</svg>
