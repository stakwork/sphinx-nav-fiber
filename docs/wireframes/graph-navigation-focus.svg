  <text x="1108" y="116" font-family="monospace" font-size="13" fill="#64748b">src/payments/service.ts</text>
  <rect x="1108" y="142" width="76" height="28" rx="14" fill="#dbeafe"/><text x="1146" y="161" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1d4ed8">Class</text>
  <text x="1108" y="216" font-family="sans-serif" font-size="14" fill="#334155">12 outgoing · 8 incoming</text>
  <line x1="1108" y1="242" x2="1410" y2="242" stroke="#cbd5e1"/>
  <g font-family="sans-serif" font-size="15" fill="#0f172a">
    <rect x="1108" y="270" width="302" height="46" rx="8" fill="#e2e8f0"/><text x="1128" y="299">＋ Expand neighbors</text>
    <rect x="1108" y="328" width="302" height="46" rx="8" fill="#e2e8f0"/><text x="1128" y="357">− Collapse branch</text>
