    <rect x="1108" y="444" width="302" height="46" rx="8" fill="#2563eb"/><text x="1128" y="473" fill="#fff">◎ Focus here</text>
    <rect x="1108" y="502" width="302" height="46" rx="8" fill="#e2e8f0"/><text x="1128" y="531">↗ Open source</text>
  </g>
