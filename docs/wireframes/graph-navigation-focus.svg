    <text x="30" y="192">▼ payments/</text><text x="52" y="224">◆ PaymentService</text>
    <text x="52" y="256">◇ Invoice</text><text x="52" y="288">◇ Wallet</text><text x="52" y="320">＋ 17 more</text>
  </g>
  <text x="24" y="374" font-family="sans-serif" font-size="13" font-weight="700" fill="#475569">DEPTH</text>
  <rect x="24" y="394" width="46" height="34" rx="6" fill="#2563eb"/><text x="47" y="417" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">1</text>
  <rect x="78" y="394" width="46" height="34" rx="6" fill="#e2e8f0"/><text x="101" y="417" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#334155">2</text>
  <rect x="132" y="394" width="46" height="34" rx="6" fill="#e2e8f0"/><text x="155" y="417" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#334155">3</text>

  <text x="300" y="44" font-family="sans-serif" font-size="16" fill="#cbd5e1">All code  /  Core  /  payments  /  PaymentService</text>
  <text x="300" y="72" font-family="sans-serif" font-size="14" fill="#94a3b8">Focus · 43 visible nodes · 71 relationships</text>

  <g stroke="#64748b" stroke-width="2">
