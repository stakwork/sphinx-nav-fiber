    <circle cx="650" cy="420" r="68" fill="#2563eb" stroke="#fff" stroke-width="5"/><text x="650" y="416" font-size="14" font-weight="700" fill="#fff">PaymentService</text><text x="650" y="442" font-size="13" fill="#dbeafe">class · selected</text>
    <circle cx="480" cy="270" r="38" fill="#7c3aed"/><text x="480" y="276" font-size="13" fill="#fff">Invoice</text>
    <circle cx="820" cy="260" r="43" fill="#059669"/><text x="820" y="266" font-size="13" fill="#fff">Wallet</text>
    <circle cx="870" cy="460" r="35" fill="#d97706"/><text x="870" y="466" font-size="12" fill="#fff">API</text>
    <circle cx="730" cy="650" r="40" fill="#db2777"/><text x="730" y="656" font-size="12" fill="#fff">Tests</text>
    <circle cx="450" cy="590" r="34" fill="#0891b2"/><text x="450" y="596" font-size="12" fill="#fff">Store</text>
    <circle cx="920" cy="160" r="28" fill="#475569"/><text x="920" y="165" font-size="11" fill="#fff">+17</text>
