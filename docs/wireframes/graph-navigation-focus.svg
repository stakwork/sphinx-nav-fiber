<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Focused node graph wireframe</title>
  <desc id="desc">A focused local graph with breadcrumbs, a selected node inspector, local actions, and orientation landmarks.</desc>
  <rect width="1440" height="900" fill="#111827"/>
  <rect x="0" y="0" width="270" height="900" fill="#f8fafc"/>
  <rect x="1080" y="0" width="360" height="900" fill="#f8fafc"/>
  <text x="24" y="44" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Graph explorer</text>
  <rect x="20" y="70" width="230" height="44" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="38" y="98" font-family="sans-serif" font-size="14" fill="#64748b">Search or jump…</text>
  <text x="24" y="154" font-family="sans-serif" font-size="13" font-weight="700" fill="#475569">CURRENT NEIGHBORHOOD</text>
